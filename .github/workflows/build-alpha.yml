name: Build Alpha APK

on:
  workflow_dispatch:
  push:
    branches: [flyme]
    # Skip doc/memory-only commits so every feature push does not publish two alphas
    paths-ignore:
      - 'context.md'
      - 'todo.md'
      - '**.md'
      - '.alpha-number'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Locate sdkmanager and install packages
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found, downloading cmdline-tools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $SDKMANAGER"
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/tmp/licenses.log || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # assembleDebug is auto-signed with the Android debug keystore.
      # assembleRelease produced an UNSIGNED apk (no signingConfig in the project),
      # which Android rejects as "package invalid".
      - name: Build signed debug APK (alpha)
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Prepare and verify APK
        id: apk
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APK"
          ls -lh "$APK"
          cp "$APK" Floating-Tab-alpha.apk

          # Verify it is signed
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying signature with $APKSIGNER"
            "$APKSIGNER" verify --verbose Floating-Tab-alpha.apk || {
              echo "APK is not properly signed"
              exit 1
            }
          else
            # Fallback: check for META-INF signature files
            if ! unzip -l Floating-Tab-alpha.apk | grep -qE 'META-INF/.*\.(RSA|DSA|EC)$'; then
              echo "ERROR: APK has no signature block"
              unzip -l Floating-Tab-alpha.apk | grep META-INF || true
              exit 1
            fi
            echo "Signature files present"
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          # Sequential alpha number (not github.run_number — that inflated past 39)
          if [ -f .alpha-number ]; then
            LAST=$(tr -d '[:space:]' < .alpha-number)
          else
            LAST=26
          fi
          NEXT=$((LAST + 1))
          echo "$NEXT" > .alpha-number
          echo "alpha_num=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next alpha number: $NEXT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Floating-Tab-alpha
          path: Floating-Tab-alpha.apk
          retention-days: 14

      - name: Create alpha pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-${{ steps.apk.outputs.alpha_num }}-${{ steps.apk.outputs.short_sha }}
          name: Alpha ${{ steps.apk.outputs.alpha_num }}
          body: |
            **Alpha ${{ steps.apk.outputs.alpha_num }}** (pre-release for testing)

            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Tag: `alpha-${{ steps.apk.outputs.alpha_num }}-${{ steps.apk.outputs.short_sha }}`
            - Signed debug APK (installable)

            ### How to test
            1. Uninstall any previous version of the app first.
            2. Install this APK.
            3. Grant Shizuku, accessibility, and overlay permissions as required.
            4. Open landscape-native apps in freeform (portrait and landscape device orientation).
            5. Check that the X (close) button is visible top-right together with the resize bar.
          files: Floating-Tab-alpha.apk
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Persist alpha number
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .alpha-number
          git commit -m "chore: bump alpha number to $(tr -d '[:space:]' < .alpha-number) [skip ci]" || exit 0
          git push || exit 0

