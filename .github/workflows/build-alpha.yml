name: Build Alpha APK

on:
  workflow_dispatch:
  push:
    branches: [flyme]

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Locate sdkmanager and install packages
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -5
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found, downloading cmdline-tools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $SDKMANAGER"
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/tmp/licenses.log || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Prepare APK artifact
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found under app/build/outputs/apk"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APK"
          ls -lh "$APK"
          cp "$APK" Floating-Tab-alpha.apk
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Floating-Tab-alpha
          path: Floating-Tab-alpha.apk
          retention-days: 14

      - name: Create alpha pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-${{ github.run_number }}-${{ steps.apk.outputs.short_sha }}
          name: Alpha build #${{ github.run_number }}
          body: |
            **Alpha build for testing**

            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Includes two-layer orientation fix (outer freeform follows system, content follows app native orientation)

            ### How to test
            1. Install this APK (uninstall previous build first if the signature differs).
            2. Grant Shizuku, accessibility, and overlay permissions as required.
            3. Open landscape-native apps (YouTube, games, etc.) in freeform while the phone is portrait **and** while it is landscape.
            4. Try freeform → full screen on those apps.

            Report any remaining orientation or crash issues on the repo.
          files: Floating-Tab-alpha.apk
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
